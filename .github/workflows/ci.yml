name: CI — PhishLens Backend Tests

on:
  push:
    branches: [ "dev", "main", "feature/**" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  backend-tests:
    name: 🐍 Python Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Create mock .env for CI
        working-directory: ./backend
        run: |
          echo "GROQ_API_KEY=mock_ci_key" >> .env
          echo "GEMINI_API_KEY=mock_ci_key" >> .env

      - name: Run backend tests
        working-directory: ./backend
        run: python -m pytest tests/ -v --tb=short

  lint-check:
    name: 🔍 Code Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8
      - name: Lint backend
        run: flake8 backend/ --max-line-length=120 --exclude=venv,__pycache__

  frontend-build:
    name: ⚛️ Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f "./frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Node 20
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run build
